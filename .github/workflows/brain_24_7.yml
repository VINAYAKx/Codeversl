name: 24/7 Autonomous Brain Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-brain-main
  cancel-in-progress: true

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 24/7 Autonomous Brain Cycle
        run: |
          python3 auto_runner.py

      - name: Commit and Overwrite Updated Brain State & Modules
        run: |
          git config user.name "Autonomous-Brain-Bot"
          git config user.email "bot@codeversl.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(brain): 24/7 autonomous cycle update"
            git push --force origin main
          fi
