name: 24/7 Autonomous Brain Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 24/7 Autonomous Brain Cycle
        run: |
          python3 auto_runner.py

      - name: Commit and Push Updated Brain State & Modules
        run: |
          git config user.name "Autonomous-Brain-Bot"
          git config user.email "bot@codeversl.local"
          git add brain_memory_state.json dynamic_skills.json synthetic_living_brain.py language_cortex.py reasoning_and_research_cortex.py
          if ! git diff --staged --quiet; then
            git commit -m "chore(brain): 24/7 autonomous cycle update [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No state changes detected in this cycle."
          fi
