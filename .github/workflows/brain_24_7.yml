name: 24/7 Autonomous Brain Loop

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-brain-main
  cancel-in-progress: true

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 24/7 Autonomous Brain Cycle Inline
        run: |
          python3 -c "import subprocess, sys, time; p = subprocess.Popen([sys.executable, "synthetic_living_brain.py"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True); out, _ = p.communicate(input="/explore autonomous systems architecture\npractice language patterns\n/quit\n", timeout=240); print(out)" || true
          python3 -c "import time; stamp = f"# [24/7-AUTONOMOUS-HEARTBEAT] Last active cycle: {int(time.time())}\n"; [open(m, "w").writelines((lines[:-1] if lines and lines[-1].startswith("# [24/7-AUTONOMOUS-HEARTBEAT]") else lines) + [stamp]) for m in ("synthetic_living_brain.py", "language_cortex.py", "reasoning_and_research_cortex.py") for lines in [open(m).readlines()]]"

      - name: Commit and Overwrite Updated Brain State & Modules
        run: |
          git config user.name "Autonomous-Brain-Bot"
          git config user.email "bot@codeversl.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(brain): 24/7 autonomous cycle update"
            git push --force origin main
          fi
