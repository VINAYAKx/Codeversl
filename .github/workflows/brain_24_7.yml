name: 24/7 Autonomous Synthetic Living Brain

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  awake_and_learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and current brain memory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git for Memory Recording
        run: |
          git config --global user.name "SyntheticLivingBrain"
          git config --global user.email "brain@users.noreply.github.com"

      - name: Wake Brain, Learn Continuously, and Record Memory
        env:
          BRAIN_CREATOR_NAME: "Max"
          LANGUAGE_ROUNDS: "2"
        run: |
          python3 -B synthetic_living_brain.py --auto-only

      - name: Commit and Push Recorded Memories
        run: |
          git pull --rebase --autostash
          git add brain_memory_state.json dynamic_skills.json
          git diff --staged --quiet || git commit -m "24/7 Wake-Up: recorded new facts, vocabulary, grammar, and episodic memory"
          git push
